[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "directing-multicam"
version = "0.1.0"
description = "AI-directed multicamera editing workflow built on polysync"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Remco Land" }]
dependencies = [
  "polysync>=0.3.0"
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
directing-multicam = "directing_multicam.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
